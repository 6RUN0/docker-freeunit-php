name: release

# Tag-driven release: build + smoke-test the PHP matrix, push the images to
# GHCR, then cut a GitHub Release with notes lifted from CHANGELOG.md.
# Trigger:  git tag -a vX.Y.Z && git push --follow-tags
on:
  push:
    tags: ["v*"]

# Least privilege at the top; the jobs that need more opt in explicitly.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to GHCR via the built-in GITHUB_TOKEN
      id-token: write # keyless (OIDC) signing for the attestations below
      attestations: write # record the provenance + SBOM attestations
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    env:
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Single-source the release coordinates from the Dockerfile ARGs (same as
      # the Makefile) so this workflow needs no edit on a version bump. GHCR
      # requires a lowercase image path, hence the owner is downcased.
      - name: derive image coordinates
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          # Guard each extraction: a drifted ARG format (quoting, inline comment,
          # spaces around =) would otherwise emit an empty value and silently push
          # a malformed tag. Fail loudly instead, mirroring check-upstream.yml.
          suite=$(sed -n 's/^ARG SUITE=//p' Dockerfile)
          default_php=$(sed -n 's/^ARG PHP_VER=//p' Dockerfile)
          freeunit_release=$(sed -n 's/^ARG FREEUNIT_RELEASE=//p' Dockerfile)
          : "${suite:?could not read ARG SUITE from Dockerfile}"
          : "${default_php:?could not read ARG PHP_VER from Dockerfile}"
          : "${freeunit_release:?could not read ARG FREEUNIT_RELEASE from Dockerfile}"
          {
            echo "IMAGE=${REGISTRY}/${owner}/freeunit-php"
            echo "VERSION=${GITHUB_REF_NAME#v}"
            echo "SUITE=${suite}"
            echo "DEFAULT_PHP=${default_php}"
            echo "FREEUNIT_RELEASE=${freeunit_release}"
          } >> "$GITHUB_ENV"

      - name: log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin

      # The immutable tags carry the image version: the FreeUnit tag
      # (<suite>-<freeunit-release>-php<X.Y>-v<version>), <version>-php<X.Y> and,
      # on the default PHP line, the bare <version>. None may exist yet: a
      # rebuilt image never has the published digest, so overwriting one would
      # silently change what a pinned tag means. Checked before the build and
      # before anything is pushed, so a refused run fails fast and leaves the
      # registry untouched.
      - name: refuse existing immutable tags
        run: |
          set -euo pipefail
          tags="$IMAGE:${SUITE}-${FREEUNIT_RELEASE}-php${PHP}-v${VERSION} $IMAGE:${VERSION}-php${PHP}"
          if [ "$PHP" = "$DEFAULT_PHP" ]; then
            tags="$tags $IMAGE:${VERSION}"
          fi
          status=0
          for tag in $tags; do
            # Only "not found" counts as absent: a registry or auth error must not
            # let the run go on and overwrite a tag it could not see. buildx
            # 0.37.1 prints "ERROR: <ref>: not found" and exits 1 for a missing
            # tag; another wording fails this step closed.
            if out=$(docker buildx imagetools inspect "$tag" 2>&1); then
              echo "::error::immutable tag $tag already exists; a partial release is finished by hand, see the comment on the push immutable tags step"
              status=1
            elif [[ "$out" != *": not found"* ]]; then
              echo "::error::cannot check $tag: $out"
              status=1
            fi
          done
          echo "IMMUTABLE_TAGS=$tags" >> "$GITHUB_ENV"
          exit "$status"

      # Reuses the Makefile target: builds php$PHP with the floating tag, then
      # runs the end-to-end smoke test against it.
      - name: build + smoke test
        run: make test DEFAULT_PHP="$PHP" IMAGE="$IMAGE"

      # The floating tags go first; the attestations bind to the digest they
      # resolve to. The immutable tags are created last, from that digest, so a
      # failure anywhere before leaves none of them and a re-run of the job
      # succeeds. Export the local ref too for the SBOM scan.
      - name: push floating tags
        run: |
          set -euo pipefail
          floating="$IMAGE:${SUITE}-php${PHP}"
          docker push "$floating"
          if [ "$PHP" = "$DEFAULT_PHP" ]; then
            docker tag "$floating" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          digest=$(docker buildx imagetools inspect "$floating" --format '{{ .Manifest.Digest }}')
          {
            echo "IMAGE_DIGEST=$digest"
            echo "IMAGE_REF=$floating"
          } >> "$GITHUB_ENV"

      # Scan the just-built image into an SPDX SBOM (from the local daemon, so no
      # re-pull). Artifact upload is off: the SBOM is published as an attestation
      # below, and parallel matrix legs would collide on a shared artifact name.
      - name: generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # Keyless (OIDC) provenance + SBOM attestations, pushed to GHCR as OCI
      # referrers of the image manifest. Verify with:
      #   gh attestation verify oci://$IMAGE@$DIGEST --owner <owner>
      # Both write a Sigstore public-good Rekor transparency-log entry, which
      # intermittently times out ("error creating tlog entry"). GitHub Actions
      # has no native retry for `uses:` steps, so each attestation runs once with
      # continue-on-error and is re-run by a guarded step only when the first
      # attempt failed — riding out a transient tlog flake without failing the
      # whole release.
      - name: attest build provenance
        id: provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: attest build provenance (retry)
        if: steps.provenance.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      # actions/attest-sbom is deprecated; actions/attest is its successor and
      # accepts the same inputs (sbom-path creates the SBOM attestation).
      - name: attest SBOM
        id: sbom
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: attest SBOM (retry)
        if: steps.sbom.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # Point every immutable tag at the attested digest (a registry-side copy,
      # no re-push of layers), then check that each resolves to it.
      # --prefer-index=false copies the single manifest as is; by default buildx
      # wraps it in a new index with another digest. If this step fails after
      # creating some of the tags, a re-run is refused by the check above; finish
      # by hand with the digest from this job's log:
      #   docker buildx imagetools create --prefer-index=false --tag <missing-tag> <image>@<digest>
      - name: push immutable tags
        run: |
          set -euo pipefail
          for tag in $IMMUTABLE_TAGS; do
            docker buildx imagetools create --prefer-index=false --tag "$tag" "$IMAGE@$IMAGE_DIGEST"
            got=$(docker buildx imagetools inspect "$tag" --format '{{ .Manifest.Digest }}')
            if [ "$got" != "$IMAGE_DIGEST" ]; then
              echo "::error::$tag resolves to $got, expected $IMAGE_DIGEST"
              exit 1
            fi
            echo "$tag -> $IMAGE_DIGEST"
          done

      - name: log out of GHCR
        if: always()
        run: docker logout "$REGISTRY"

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull just this version's section out of CHANGELOG.md for the release body
      # (everything between this `## [x.y.z]` heading and the next `## [`).
      - name: extract changelog section
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "ERROR: no CHANGELOG.md section for $version" >&2
            exit 1
          fi

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
