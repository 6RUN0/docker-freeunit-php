# One image, two roles, selected by the entrypoint hook system. Build and run:
#
#   docker compose up --build        # from this directory
#
# then:
#   * web  -> open http://localhost:8080/
#   * cron -> watch it fire: docker compose logs -f cron
#
# Both services run the SAME image. The only difference is the command, which the
# base entrypoint turns into a different launch mode: `web` uses the image's
# default (unitd, the Unit web server); `cron` passes `supercronic`, which the
# handle_supercronic hook execs instead. That is why the hook system exists --
# add a long-lived companion service without a second image or a forked
# entrypoint, and every base-entrypoint fix reaches both roles.
services:
  web:
    build: .
    image: freeunit-php-cron-example
    ports:
      - "8080:8080"
    cap_drop:
      - ALL
    cap_add:
      # The Unit master starts as root and drops each worker to the app
      # user/group from config.json; SETUID/SETGID are all it needs.
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cron:
    # Same build + image tag as `web`, so the image is built once and reused.
    build: .
    image: freeunit-php-cron-example
    depends_on:
      - web
    # Replace the default `unitd` command: the entrypoint dispatches this to the
    # handle_supercronic hook, which execs the cron runner instead of Unit. No
    # ports and no Unit config are needed -- this container never starts Unit.
    command: ["supercronic"]
    # The cron role never starts Unit, so the image's HEALTHCHECK (which probes
    # the Unit control socket) would mark this container unhealthy forever.
    # Disable it here; supercronic is the liveness signal for this role.
    healthcheck:
      disable: true
    cap_drop:
      - ALL
    cap_add:
      # The hook provisions a dedicated `worker` user and drops root -> worker via
      # setpriv (exec_as_user), which needs the same two capabilities the Unit
      # master uses to drop its workers in the web role.
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
