# Local development: edit PHP under ./www and reload the page -- no rebuild. Run:
#
#   docker compose up --build        # from this directory
#
# then open http://localhost:8080/. Edit www/index.php and reload: the change is
# live, because ./www is bind-mounted and Unit re-reads PHP files per request.
#
# Two things are NOT live and DO need a rebuild / recreate:
#   * the PHP line (PHP_VER in .env) -- it is a build arg: `docker compose up --build`
#   * config.json -- it is baked into the image and applied when the container
#     starts with an empty state dir (/run/freeunit), so `docker compose up --build`
#     (which recreates the container) applies an edited config.
services:
  app:
    build:
      context: .
      args:
        # Forwarded from .env so the PHP line is chosen without editing files here.
        PHP_VER: ${PHP_VER}
    ports:
      - "8080:8080"
    environment:
      # QUIET_LOGS silences the entrypoint's own info/notice chatter.
      UNIT_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      # App code, bind-mounted read-only: host edits are live (no rebuild).
      - ./www:/www:ro
      # Writable app state on a named volume. A fresh named volume copies the
      # owner of the mount point, which the Dockerfile creates as 65532, so the
      # worker writes there with no runtime chown. index.php writes here to prove it.
      - data:/data
    # The image runs as the non-root user 65532, Unit included, so it keeps no
    # capability at all.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  data:
