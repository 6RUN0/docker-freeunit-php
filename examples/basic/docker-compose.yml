# Self-contained hardened deployment: examples/Dockerfile bakes the app and its
# Unit config onto the published freeunit-php base, so nothing is bind-mounted.
# Build and run with:
#
#   docker compose up --build
#
# then open http://localhost:8080/.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    # Read-only root filesystem: the only writable paths are the two tmpfs
    # mounts, owned by the image user. /run holds the Unit socket, pid and state;
    # /tmp the request-body buffers and PHP temp files (a host dir on disk is
    # the better place for large uploads).
    read_only: true
    tmpfs:
      - /run:size=16m,uid=65532,gid=65532,mode=0700
      - /tmp:size=64m,uid=65532,gid=65532,mode=0700
    # The image runs as the non-root user 65532, Unit included, so it keeps no
    # capability at all.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
